services:
  db:
    image: postgres:15-alpine
    container_name: iot_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iot_database
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iot_database"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: iot_api
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/iot_database
      FLASK_DEBUG: "0"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
